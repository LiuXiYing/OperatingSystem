      - 题目结构：Lab5.md 必须保留作业模板的完整结构，题 1 到题 30 共 30 道单项选择题，按题型分为五组（题 1～8 操作系统概述与系统调用、题 9～14 进程状态与上下文切换、题 15～20 处理机调度、题 21～24 地址空间与分段、题 25～30 分页与地址转换），每题 4 个选项，全卷共 120 个选项；不得删除、合并、新增题目或选项，不得改写题面，不得调整选项顺序，不得把按题型分组改回按年份分组。
      - 作答完整性：每道题都必须作答，将该题所选选项前的 [ ] 改为 [x]，全卷恰好 30 处 [x]，每题恰好一处；整卷没有任何 [x]、某题未勾选，或一题勾选多项，均判为未完成作答。
      - 答案边界：答案只能通过勾选产生，学生不得在提交文件中自行添加正确答案、答案解析、答案速查表或题目年份对照表，也不得改动作答说明、分组表等教师模板文字；在文件末尾另附答案清单的，按多余内容处理并在反馈中指出。
      - 判定边界：本文本阶段只检查文件完整性与作答完整性，即每题是否填写了答案，不判断所选选项是否正确，不核对、不解释正确答案，也不因答案分布、与他人相同或与他人不同而判为不合格；内容正确性将在期末统一检测。
  Lab6:
    deadline: "2026-11-16T23:59:59+08:00"
