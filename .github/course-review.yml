version: 1

course:
  name: 操作系统
  timezone: Asia/Shanghai
  title_template: "[{student_id}{student_name}]{assignment_id}作业提交"
  submission_path_template: "{student_id}{student_name}/{assignment_id}"
  merge_method: merge

features:
  auto_merge: true
  comment_review: true
  close_late_pr: true
  ai_review: true
  ai_feedback: true
  ocr_review: false
  vision_review: true
  metrics: true

defaults:
  min_nonempty_lines: 10
  allow_extra_files: false
  late_close_after_days: 7

ai:
  providers:
    - provider: glm
      model: glm-4.7-flash
    - provider: gemini
      model: gemini-3.5-flash-lite
  consensus_rounds: 3
  min_confidence: 0.8
  timeout_seconds: 60
  max_attempts: 5
  max_file_bytes: 200000
  max_total_bytes: 500000
  max_output_tokens: 2048

feedback:
  timeout_seconds: 20
  max_input_bytes: 100000
  max_output_tokens: 2048

ocr:
  detection_model: PP-OCRv6_small_det
  recognition_model: PP-OCRv6_small_rec
  min_line_confidence: 0.65
  max_text_chars: 20000

vision:
  providers:
    - provider: glm
      model: glm-4.1v-thinking-flash
    - provider: gemini
      model: gemini-3.5-flash-lite
  consensus_rounds: 3
  min_confidence: 0.85
  fail_confidence: 0.9
  timeout_seconds: 90
  max_attempts: 5
  max_images: 6
  max_image_bytes: 5000000
  max_total_bytes: 12000000
  max_pixels: 25000000
  max_side: 4096
  max_output_tokens: 4096

# 发布作业时在这里追加 Lab2、Lab3 等配置。
# required_files 为精确文件名，不支持通配符；vision_files 支持 fnmatch 通配符。
assignments:
  Lab1:
    deadline: "2026-10-12T21:59:59+08:00"
    report_template: homework/Lab1/Lab1.md
    required_files:
      - Lab1.md
      - imgs/lab1_vmware_version.png
      - imgs/lab1_ubuntu_version.png
      - imgs/lab1_network.png
      - imgs/lab1_resources.png
      - imgs/lab1_toolchain.png
    vision_files:
      - imgs/lab1_vmware_version.png
      - imgs/lab1_ubuntu_version.png
      - imgs/lab1_network.png
      - imgs/lab1_resources.png
      - imgs/lab1_toolchain.png
    review_points:
      - 审核范围：本作业只审核任务一至任务五的记录表格、环境验收总结表，以及「截图要求」小节列出的 5 张截图。操作手册里的创建课程基线快照、常见问题排查、安装介质校验码核对等内容属于补充说明，不要求在本报告中执行、填写或截图，报告中保留或删除都不影响判定。学生额外记录自己的排错过程可以接受，不因此加分，也不因未记录而扣分。
      - 任务一 VMware 版本：应以 VMware Workstation Pro 的 Help → About 页面显示的实际版本为准，填写完整版本号，并明确是否与教师指定的 VMware Workstation Pro 26H1 for Windows 一致。版本号按本人安装包如实填写即可，不要求与讲义文字逐字相同；只写产品大类名称而没有版本号时记为不完整。
      - 任务二 Ubuntu 版本：/etc/os-release 的 PRETTY_NAME 应同时包含 Ubuntu 24.04 与 LTS；uname -m 应为 x86_64；安装介质版本应包含 Ubuntu 24.04.4 LTS。安装后执行过系统更新时，当前小版本高于 24.04.4 属于正常现象，不算错误。三项应按本人输出填写，照抄讲义示例而不核对本人输出时记为未完成。
      - 任务三 虚拟机联网：应记录本人虚拟机的私有 IPv4 地址（以 192.168、172 或 10 开头）和包含 default via 的默认路由；ping 223.5.5.5 与 ping 域名应成功；sudo apt update 应能正常完成且没有 Err 或 Failed。本作业不要求更换软件源，使用官方源（archive.ubuntu.com）或国内镜像站同样合格，不得因为报告中未换源、或 Get 行来自官方源而判为未完成或不完整。所在网络禁止 ping 时，只要 apt update 成功并在表格中说明情况，可判为合格。IP 地址、镜像站域名和网络模式按本人环境填写。
      - 任务四 CPU 内存与存储：虚拟 CPU 至少 2 核、内存至少 4GB、虚磁盘至少 40GB，且与所选配置档位一致。free -h 与 df -h / 的显示值略小于 VMware 中设置的数值属于正常现象，不算错误。所选档位、核心数、内存和虚磁盘容量应按本人设置填写；档位与数值明显矛盾时记为不完整，并在反馈中指出矛盾之处。
      - 任务五 软件安装与 vim：open-vm-tools 状态应为 active；gcc（或 cc）、make、gdb、git 四个命令都应能输出版本号，说明 build-essential、gdb、git 已安装；openssh-server 应已安装，ssh -V 能输出版本信息，且 22 端口处于监听（Ubuntu 24.04 下 SSH 由 ssh.socket 按需激活，systemctl is-active ssh 显示 inactive 属于正常现象，不据此判错）；vim --version 应显示完整版 Vim，而不是 command not found 或 Small version；dpkg-query 检查到的软件包都应显示已安装版本。本次实验不要求编译 C 程序，报告中没有编译运行结果不扣分。个别工具未安装时，应在报告中说明并补齐后重新截图，不直接判为不合格；工具链、SSH 或 vim 整体缺失且报告中未作说明时记为未完成。
      - 提交物边界：本作业只要求提交 Lab1.md 与 5 张截图，不要求提交任何代码、脚本或文本文件。学生在报告中提到用 vim 创建了 hello.txt 时，只要截图能证明完成了编辑与保存即可，不需要上传该文件；报告中没有出现 hello.txt、hello.c 等源文件时不得判为未完成，也不要要求学生补交文件。学生的提交目录里若出现了作业清单以外的文件，按多余文件处理，并在反馈中指出应删除的文件名。
      - 环境验收总结表与结论边界：总结表每一行只需给出明确结论，遇到的问题、解决方法及能否继续后续实验应在表后统一说明，不要求在每一行重复。只要前文任务表已填写且与总结一致，不得因总结表未重复版本号、IP 或容量数值而判为不合格。报告中不得编造讲义未给出的信息，也不得用截图以外的推测代替实际结果。
    vision_review_points:
      - 截图总要求：必须是学生本人环境的电脑截图，终端截图需同时显示命令和对应输出，文字清晰可读，并能辨认本人虚拟机的用户名、主机名、IP 或学号姓名。出现手机拍摄屏幕的反光、摩尔纹或明显倾斜时判为不合格；截图中不得出现密码、私钥或访问令牌。同一任务允许合理拼图或裁剪无关区域，但不能裁掉命令、时间或关键结果。
      - lab1_vmware_version.png：应能看到 VMware Workstation Pro 的 Help → About 页面，并能辨认完整版本号。只截主界面或安装向导、看不出版本号的判为不合格。窗口大小、语言界面与主题配色不扣分。
      - lab1_ubuntu_version.png：应能看到 cat /etc/os-release 的输出（含 Ubuntu 24.04 与 LTS）、uname -m 的 x86_64，以及 sudo cat /var/log/installer/media-info 的介质版本。三项中缺一项时判为不完整并在反馈中指出缺哪一项，不直接判为不合格；三项全缺判为不合格。
      - lab1_network.png：应能看到私有 IP 与默认路由的输出、ping IP 与 ping 域名的结果，以及 sudo apt update 成功且没有 Err、Failed。软件源用官方源或国内镜像站均可，不因未换源而判为不完整。所在网络禁止 ping 时，以 apt update 成功为主要证据，能看到成功下载且无 Err、Failed 即可通过。ping 与 apt update 两类证据缺任意一类时判为不完整；两类全缺判为不合格。
      - lab1_resources.png：应能看到 nproc、free -h、lsblk 与 df -h / 中至少 nproc 与 free -h 的输出，并能辨认核心数、内存与虚磁盘容量。四项中缺一到两项时判为不完整并在反馈中指出，不直接判为不合格；完全看不到容量信息判为不合格。
      - lab1_toolchain.png：应能看到软件包安装状态或 gcc、make、gdb、git、vim、ssh 各版本号输出中的至少三类，以及用 vim 编辑 hello.txt 的画面和 cat hello.txt 的输出。看不到 vim 编辑画面或文件内容输出时判为不合格；工具版本号只出现一两类时判为不完整，并在反馈中指出缺哪一类。文件内容中应能辨认本人学号姓名。
      - 报告与截图的一致性：报告填写的版本号、IP、内存与磁盘容量应与截图方向一致。截图中的私网地址与报告填写的 IP 明显矛盾，或报告称工具链齐全但截图显示命令未找到时，应指出。报告数值与截图的取整方式不同（如 3.8Gi 与 4096MB）属于合理差异，不判为不合格。
  Lab2:
    deadline: "2026-10-19T23:59:59+08:00"
    report_template: homework/Lab2/Lab2.md
    required_files:
      - Lab2.md
      - imgs/lab2_build_run.png
      - imgs/lab2_syscalls.png
    # 仅对本次新作业启用行数与 Markdown 符号数量检查；已发布的 Lab1 继续原有审核规则。
    template_metrics:
      enabled: true
      report_file: Lab2.md
      characters: ['#', '-', '*', '`', '|', '>']
      max_file_bytes: 200000
    vision_files:
      - imgs/lab2_build_run.png
      - imgs/lab2_syscalls.png
    review_points:
      - 审核范围：本作业只审核任务一至任务七的填写区，以及「截图要求」小节列出的 2 张截图。「选读」小节不要求执行、填写或截图；常见问题、自查表属于辅助内容，填与不填都不影响判定。题目、说明、示例和选读内容须完整保留，但数量检查通过只说明没有删减模板，不能代替对填写内容的审核。
      - 任务一 目录与身份：应填写本人学号姓名、whoami 输出的 Ubuntu 用户名、hostname -I 输出的虚拟机私有 IPv4 地址（以 192.168、172 或 10 开头），以及报告在本地仓库中的相对路径（形如 学号姓名/Lab2/Lab2.md）。用户名、IP 按本人环境填写，不要求等于示例；照抄示例身份 2026333001张三 而未替换为本人时记为未完成。
      - 任务二 送文件：应说明 hello.c 是用 VS Code Remote-SSH 还是 scp 送进虚拟机，并填写 pwd 输出的练习目录完整路径（应以 /home/用户名/os-labs/Lab2 结尾）。两种方式任选其一即可，不得因为没有同时使用两种而判为不完整；是否一次成功一栏如实填写，记录了失败与解决过程的可以接受，不因此扣分。用图形界面复制粘贴或其他方式送文件但目录和文件核对无误的，在反馈中提醒即可，不判为未完成。
      - 任务三 工具与身份标记：gcc 与 strace 都应填写版本第一行并标明可用；strace 初次缺失但已按讲义安装并重新验证的，算完成。版本号按本人输出填写，不要求与示例或同学一致。
      - 任务四 运行前预测：三个预测问题都应有填写。预测可以与实际不符，不因预测错误扣分；全部留空或在运行后倒填成与结果完全一致且未保留预测痕迹时，记为不完整并在反馈中提醒。
      - 任务五 编译与运行：应填写本人实际使用的编译命令（gcc hello.c -o hello 或等价写法）、编译成功后屏幕上有什么没什么（提示符回来、没有 error）、是否出现过报错及修改，以及 hello.c 与 hello 分别是什么（源码文本与可执行文件）。观察表三行应填本人实际结果并说明是否与预测相符，程序结束状态应为 echo $? 得到的 0。解释题应说明等待回车是 getchar 在等待输入，不是崩溃。报告只写编译成功却没有任何观察记录时记为不完整。
      - 任务六 系统调用证据：证据表应各填写一条本人 trace.txt 中的真实记录，一条是第一参数为 1 的 write，一条是第一参数为 0 的 read，并用中文解释其含义。本作业不要求修改问候，全体同学的源码相同，write 记录为 Hello, OS! 的输出（含换行共 11 个字节）属于正常现象，不得以与讲义示例相同为由判为未完成；read 的请求长度（通常 4096 或类似值）与实际返回长度（按回车通常为 1）应分别填写，并说明返回值不等于请求长度、不代表键入了那么多字节。其他文件描述符一问能说明是运行库或加载器读写文件、与本程序输入输出无关即可。
      - 任务七 知识问答：四题都应作答，每题一至四句。第 1 题应区分源码文件、可执行文件与正在运行的进程三者；第 2 题应说明 printf 是 C 库函数、write 是系统调用，库有缓冲或合并，所以 printf 行数不等于 write 次数；第 3 题应结合本人观察到的 read 或 write 记录说明程序通过系统调用请求操作系统完成输入输出，只写管理资源记为不完整；第 4 题写一个真实遇到的问题或一个主动核对的步骤即可。
      - 提交物边界：本作业只要求提交 Lab2.md 与 2 张截图，不要求提交 hello.c、hello、trace.txt 或 output.txt。报告中提到这些文件时不得要求学生补交；提交目录里出现清单以外的文件按多余文件处理，并在反馈中指出应删除的文件名。
      - 合理差异与结论边界：用户名、IP、路径、gcc 与 strace 版本、字节数均按本人环境填写，与讲义示例不同不扣分；strace 开头出现运行库读取文件的 read 记录属于正常现象。报告不得编造讲义未给出的记录，也不得用截图以外的推测代替实际结果；报告内容真实、核心步骤确实做过并能自证即判为合格，不因个别措辞不精确或输出夹带无关行而降级。
    vision_review_points:
      - 截图总要求：必须是学生本人环境的电脑截图，终端截图需同时显示命令和对应输出，文字清晰可读，并能辨认本人身份标记（echo 输出的学号姓名）或本人虚拟机的用户名、主机名。允许通过 VS Code 集成终端截图。出现手机拍摄屏幕的反光、摩尔纹或明显倾斜时判为不合格；截图中不得出现密码、私钥或访问令牌。同一任务允许合理拼图或裁剪无关区域，但不能裁掉命令或关键结果。
      - lab2_build_run.png：应能看到 echo 输出的本人身份标记、gcc 编译命令且无 error 报错，以及 ./hello 的完整输出（问候行、Press Enter to finish. 与 Finished.）。已经按过回车、三行一起出现属于正常情况，不要求截到等待状态。缺身份标记或缺 echo $? 时判为不完整并在反馈中指出；看不到编译命令或看不到程序输出时判为不合格。
      - lab2_syscalls.png：应能看到 strace -o trace.txt -e trace=read,write ./hello 的命令、程序本身的输出，以及从 trace.txt 中查看或用 grep 筛选出的 write(1, ...) 与 read(0, ...) 真实记录。只出现 write 或只出现 read 一类时判为不完整并指出；看不到任何 trace 记录时判为不合格。write 记录应为程序输出 Hello, OS! 的记录，全体同学相同属于正常现象。
      - 报告与截图的一致性：报告填写的证据记录、字节数应与截图方向一致。报告的 write、read 记录在截图中找不到对应行时，应指出。字节数、时间与行数的细微差异属于合理差异，不判为不合格。
  Lab3:
    deadline: "2026-10-26T23:59:59+08:00"
    report_template: homework/Lab3/Lab3.md
    required_files:
      - Lab3.md
      - imgs/lab3_process.png
      - imgs/lab3_family.png
    # 延续 Lab2 起对新作业启用的行数与 Markdown 符号数量检查；已发布的 Lab1、Lab2 保持原有规则。
    template_metrics:
      enabled: true
      report_file: Lab3.md
      characters: ['#', '-', '*', '`', '|', '>']
      max_file_bytes: 200000
    vision_files:
      - imgs/lab3_process.png
      - imgs/lab3_family.png
    review_points:
      - 审核范围：本作业只审核任务一至任务八的填写区，以及「截图要求」小节列出的2张截图。「选读：程序替换exec」不要求执行、填写或截图，选做处填「未做」即算完成，若做了只要与strace实际输出一致即可、不因此要求补交；「常见问题」「自查表」属于辅助内容，填与不填都不影响判定。题目、说明、示例、表格和图片引用须完整保留，但模板数量检查通过只说明没有删减模板，不能代替对填写内容的审核。
      - 任务一 目录与送文件：应填写本人学号、姓名（不得照抄示例2026333001张三）；送文件方式写Remote-SSH或scp其中之一即可，不得因没有同时使用两种而判为不完整；练习目录完整路径应填pwd输出（以 /home/用户名/os-labs/Lab3 结尾）；是否一次成功如实填写，记录了失败与解决过程的可以接受，不因此扣分。
      - 任务二 编译与状态：应填写本人实际执行的编译命令（gcc observe.c -o observe 或等价写法）、编译状态（echo $? 的输出应为0）、以及警告或错误的第一条内容和修改（没有时写「无」）。编译命令与题目示例略有出入（如自行加了警告选项）按本人实际操作填写，不扣分；状态与描述互相矛盾（如状态为0却描述编译失败）应指出。
      - 任务三 ps观察表：PID与PPID两行都应填observe自身输出与ps查询输出两组数字，同一行两个来源的数值应一致；STAT应填ps实际显示的字母，本场景通常为S或S+（可中断睡眠、等待终端输入，+表示前台进程组），如实记录为其他字母时以本人真实输出为准，不得硬改成S；COMM应为observe。解释题应说明程序停在getchar等待键盘输入属于阻塞（等待）状态、不占用CPU，所以同一时间CPU可以运行B的ps命令；把等待输入解释为CPU忙等或占用CPU的记为错误。
      - 任务四 两个进程与父子链：比较表中两次运行的可执行文件名应同为observe或./observe，两次实际PID应不同，两行都应仍在等待回车；两条父子链的「父」一栏应与对应observe输出里的parent数字一致、「子」一栏与pid数字一致；PPID按本人两个终端各自Shell的实际输出填写，两个终端下两条链的父一般不同（对应两个不同的Shell进程），回答应说明这一点。解释应说明同一文件启动两次就是两个不同进程、各有独立编号。两次PID填成相同且与截图矛盾、或父子链数字与observe输出对不上时指出。
      - 任务四 结束与复查：结束后仍用A原来的PID执行ps，通常不再有数据行（可能只剩表头）；紧接的echo $?在无匹配进程时通常为非零（常见1），如实填写即可，不得因非零判为系统故障或不合格；磁盘上的observe文件仍然存在（如用ls核对目录中仍有该文件）。把「进程结束」与「文件被删除」混为一谈应指出。
      - 任务五 运行前预测：三问都应有填写。正常应有2行进程信息（子进程行与父完成行）；子进程行先出现，因为父进程用waitpid等到子进程结束后才打印完成行；子进程的parent字段应与父完成行的pid相等。预测与实际不符不扣分，留空按不完整提醒。
      - 任务六 family运行与问答：两次运行都应填子pid、子行parent、父完成行pid、输出顺序与结束状态；关系应满足子行parent等于父完成行pid，输出顺序应为子进程行在前，echo $?应为0；两次运行编号不同属正常。问答三题都应有回答：fork返回0不代表子PID为0，0只是子进程分支的标志，子进程真实编号要用getpid()取得；仅凭代码书写位置不能一般判断父子执行先后，本例由waitpid保证父进程等到子进程结束后才继续，因此子行先出现；waitpid除等待外还收集子进程退出状态，本例传NULL表示不保存状态，等待本身不依赖状态缓冲，传NULL仍能完成等待。把fork返回0解释成子PID为0、或声称看代码行就能决定执行先后，应按错误指出。
      - 任务七 调度手算：FCFS时间轴应为A、A、A、B、B；RR（时间片1）应为A、B、A、B、A。指标应为——FCFS中A首次0、完成3、响应0、周转3、等待0，B首次3、完成5、响应3、周转5、等待3；RR中A首次0、完成5、响应0、周转5、等待2，B首次1、完成4、响应1、周转4、等待2。结论应说明轮转使B更早获得首次响应，但不是每个任务都更早完成（A反而更晚完成）。时间片很小时的开销写出上下文切换、时间片中断或调度开销中任意一项即可。表中数字与上述不一致时按错误指出；叙述措辞不同不影响判定。
      - 任务八 用自己的话回答：四题都应作答，每题2至4句为宜。第1题应说明等待键盘的observe属于阻塞（等待）状态，Linux中R表示正在运行或可运行（runnable），不能机械只译成「已经占有CPU」；第2题应区分并发（交替推进、宏观同时微观轮流）与并行（同一时刻真正同时执行），并指出单CPU的两种调度属于并发而非并行；第3题应区分编号（PID是进程的身份标识）、状态（运行、就绪、阻塞等处境）和调度次序（谁先获得CPU的先后安排）；第4题如实写一项遇到的问题、定位方法与最终状态，或一项主动核对。只答「不知道」等无实质内容的按未完成，措辞不同不扣分。
      - 提交物边界：本作业只要求提交Lab3.md与2张截图，不要求提交observe.c、family.c、launch.c、可执行文件或strace日志，练习用的这些文件留在虚拟机的 ~/os-labs/Lab3 中不复制进仓库；选读的答案只填写在报告相应区域，不额外提交截图、源码或结果文件。报告中提到这些文件不得要求学生补交；提交目录里出现清单以外的文件按多余文件处理，并在反馈中指出应删除的文件名。
      - 合理差异与结论边界：PID、PPID、目录路径、编译命令选项按本人环境填写，与题目示例不同不扣分；两次运行编号不同属正常。报告不得编造实际未观察到的输出，也不得用推测代替实测；报告真实、核心步骤确实做过并能自证即判为合格，不因个别措辞不精确或输出夹带无关行而降级。
    vision_review_points:
      - 截图总要求：必须是学生本人环境的电脑截图，终端截图需同时显示命令和对应输出，文字清晰可读；一张截图可包含同一任务下的多条命令及其输出，但每条命令与其输出必须能对应上。出现手机拍摄屏幕的反光、摩尔纹或明显倾斜时判为不合格；截图中不得出现密码、私钥或访问令牌。允许并排两个终端并裁剪无关区域，但不能裁掉命令或关键结果；本作业不要求截图出现身份标记，是否能看到用户名、主机名不作判分依据。
      - lab3_process.png：应并排显示A、B两个终端（tmux分屏的两个窗格或两个窗口均可）：A终端里observe输出的pid与parent、B终端里对A那个PID的ps命令及结果（能看到PID、PPID、STAT、COMM字段）、B终端里第二次启动的另一个observe输出（其PID与A不同）。三要素缺一至两项时判为不完整并在反馈中指出缺哪项；看不到ps结果或看不到两个observe输出时判为不合格。
      - lab3_family.png：应能看到family的编译命令、两次真实运行的完整输出（各含child行与parent完成行）及其结束状态（echo $?，通常为0），数字应清楚。两次运行缺一次或看不到结束状态时判为不完整并指出；看不到任何family运行输出时判为不合格。
      - 报告与截图的一致性：报告填写的PID、PPID应与截图方向一致；截图ps结果中的数字与报告表格明显矛盾、或family子行parent与父完成行pid在报告与截图对应不上时应指出。数字显示格式、换行差异属于合理差异，不判为不合格。
