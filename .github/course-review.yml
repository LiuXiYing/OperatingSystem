      max_file_bytes: 200000
    vision_files:
      - imgs/lab4_pointer.png
      - imgs/lab4_memory_maps.png
    review_points:
      - 审核范围：本作业只审核任务一至任务八的填写区，以及「截图要求」小节列出的 2 张截图。「选读：地址范围与跨次比较」不要求执行、填写或截图，选做处填「未做」即算完成；「常见问题」「自查表」属于辅助内容，填与不填都不影响判定。题目、说明、示例、表格和图片引用须完整保留，但模板数量检查通过只说明没有删减模板，不能代替对填写内容的审核。
      - 任务一 目录与文件：应填写本人练习目录的完整路径（pwd 输出，应以 /home/用户名/os-labs/Lab4 结尾）、A/B 是否属于同一 Ubuntu 与同一登录用户、pointer.c 与 memory.c 是否齐全，以及源码通过哪种方式送进虚拟机。用 scp 按讲义操作即可，不要求同时使用 Remote-SSH；路径按本人用户名填写，不要求与示例一致，照抄示例路径而未替换为本人目录时记为未完成。是否遇到问题一栏如实填写，记录了失败与解决过程的可以接受，不因此扣分。
      - 任务二 pointer 预测与理解：四个预测问题都应有填写。before 通常为 10，after 通常为 20；p 保存的是 value 的地址而不是 10；*p 与 value 在本程序中访问同一个 int。预测与实际不符不扣分，留空按不完整提醒；解释题应说明 p 保存 &value、*p = 20 通过地址修改了同一个变量，只描述输出而没有说明指针作用或声称重新赋值 value 的，应指出。
      - 任务三 pointer 编译与运行：应填写本人实际执行的编译命令（gcc pointer.c -o pointer 或等价写法）、编译结束状态（0）、before 与 after 的实际输出，以及运行结束状态（0）。before/after 应为 10 与 20，若与本人截图不一致应指出；编译或运行状态非 0 但报告如实记录并说明原因、最终重新验证成功的，可以接受，不因曾出现错误直接判为不合格。报告只写输出结果而没有编译或运行命令记录时记为不完整。
      - 任务四 memory 读程序与预测：四个预测问题都应有填写。子进程的 value 应为 20，父进程最终的 value 应为 10；同一次 fork 中父子打印的地址数值应相同；父进程不会在子进程修改前打印，因为 waitpid 等到子进程结束后才继续。预测错误不扣分，但留空或在运行后倒填成与实际完全一致且没有保留预测痕迹的，按不完整提醒。
      - 任务五 memory 编译与停在等待处：应填写编译命令与编译结束状态（0）、本次子进程 PID、子进程打印的完整地址、子进程的 value（20），并确认父进程完成行尚未出现。子进程必须停在 Press Enter to finish the child. 等待处，截图应在按回车前保留该状态；报告显示子进程已经结束却仍声称本次查询了 maps，或混用不同次运行的 PID、地址时，应指出。
      - 任务六 maps 查询与记录：应按子进程 PID 执行 ps -p 子PID -o pid,ppid,stat,comm，STAT 通常为 S 或 S+、COMM 为 memory；用 cat /proc/子PID/maps 查看完整映射，并用 grep '/memory$'、grep -F '[stack]'、grep -F '[heap]' 分别筛出代码映射、栈和堆。memory 的可执行映射应选权限串第三位为 x 的行（通常 r-xp），不能拿第一行 r--p 冒充代码段；[stack] 通常为 rw-p 且地址在 7fff... 附近；[heap] 是否出现取决于本次运行，未出现时照实写「本次未出现 [heap]」即为完成，不得伪造，也不因未出现判为不合格；若本次出现 [heap] 而报告未记录，按不完整提醒。
      - 任务六 记录拆解与地址对照：区间起点、终点、完整权限串、是否可写、p/s 含义、路径或标签都应填写；可执行映射通常不可写，[stack] 与 [heap] 通常可写，第四位 p 表示私有映射。打印地址（带 0x）应与 [stack] 区间（不带 0x）按十六进制比较，满足 起点 <= 地址 < 终点 即可，不要求等于起点；地址落在区间外且报告未检查 PID 是否抄错、是否为同一次运行时，应指出。p 只说明私有映射，不能单独证明物理页从未共享，报告中出现这类过度结论时应提醒。
      - 任务七 结束子进程与父子对照：回到 A 只按一次回车，父进程在 waitpid 返回后打印；应填写同一次运行的子/父 PID、完整地址、value、谁先打印，以及程序结束状态（echo $? 通常为 0）。同一次运行中父子地址数值应相同，子进程的修改不应改变父进程最终打印的 value（子 20、父 10），子进程行应先出现；把父子地址不同解释为地址空间随机化，或用两次不同运行的输出来比较，应指出。问答四题都应有回答：不能解释为父进程打印太早，因为父进程在 waitpid 后及子进程退出后才打印；预测需要修正的应如实说明。
      - 任务七 退出后复查：子进程退出后重新执行 cat /proc/子PID/maps 通常提示 No such file or directory 或对应目录不存在，应如实记录；磁盘上的 memory 文件仍然存在。把进程退出与文件删除混为一谈，或声称退出后仍能读到原 maps 的，应指出。
      - 任务八 用自己的话回答：五题都应作答，每题 2 至 4 句为宜。第 1 题应说明相同虚拟地址属于不同进程、各自有独立地址空间和页表（fork 后有各自的副本，写时复制），同一虚拟地址可映射到不同物理页，所以值为 20 与 10；第 2 题应说明 printf 与 maps 只反映虚拟地址和权限，不能证明物理内存从 fork 起就完全独立，写时复制可能先共享物理页；第 3 题应说明 p 表示私有映射，不等于「物理页绝不共享」；第 4 题应说明不能据此推断永远无法共享数据，共享内存、mmap MAP_SHARED、管道等都可以共享；第 5 题如实写一项问题、定位方法与最终状态，或一项主动核对。只答「不知道」等无实质内容或明显与实验结论矛盾的，按未完成处理；措辞不同不扣分。
      - 提交物边界：本作业只要求提交 Lab4.md 与 2 张截图，不要求提交 pointer.c、memory.c、可执行文件或任何 maps 日志，练习用的文件留在虚拟机的 ~/os-labs/Lab4 中。选读的答案只填写在报告相应区域，不额外提交截图、源码或结果文件。报告中提到这些文件不得要求学生补交；提交目录里出现清单以外的文件按多余文件处理，并在反馈中指出应删除的文件名。
      - 合理差异与结论边界：PID、地址、目录路径和编译命令选项按本人环境填写，与讲义示例不同不扣分；同一次 fork 内父子地址相同，不同次运行地址可以不同，属于正常现象。报告不得编造实际未观察到的输出，也不得用推测代替实测；报告真实、核心步骤确实做过并能自证即判为合格，不因个别措辞不精确或输出夹带无关行而降级。
    vision_review_points:
      - 截图总要求：必须是学生本人环境的电脑截图，终端截图需同时显示命令和对应输出，文字清晰可读；一张截图可以包含同一任务下的多条命令及其输出，也可以包含并排的两个终端，但每条命令与其输出必须能对应上。出现手机拍摄屏幕的反光、摩尔纹或明显倾斜时判为不合格；截图中不得出现密码、私钥或访问令牌。允许裁剪无关区域，但不能裁掉命令或关键结果；本作业不要求截图出现身份标记，是否能看到用户名、主机名不作判分依据。
      - lab4_pointer.png：应能看到 gcc pointer.c -o pointer 的编译命令、echo $? 的编译结束状态、./pointer 的运行命令与 before=10、after=20 两行输出，以及运行后的 echo $?（通常为 0）。看不到编译命令、运行命令或 before/after 任意一行时判为不合格；仅缺少编译结束状态或运行结束状态中的一项时判为不完整并在反馈中指出。
      - lab4_memory_maps.png：应能看到同一次运行的子进程行（child pid=...、address=...、value=20）、父进程行（parent pid=...、address=...、value=10）、结束状态（echo $?，通常为 0），以及 B 终端在子进程存活时执行的 maps 查询：ps 命令与结果、grep '/memory$' 得到的带 x 代码映射、grep -F '[stack]' 得到的栈映射；有 [heap] 记录则一并保留，本次出现但未截入时按不完整提醒，未出现不扣分。看不到子进程行或看不到任何 maps 查询结果时判为不合格；缺父进程行、代码映射与 [stack] 映射缺一至两类，或 ps 结果、结束状态缺少一至两项时判为不完整并指出。不得因 [heap] 未出现而判为不完整。
      - 报告与截图的一致性：报告填写的 PID、完整地址、父子 value 和结束状态应与截图方向一致；同一次运行中父子地址数值应相同，报告中的地址应落在截图抄录的 [stack] 区间内。截图中的 PID、地址与报告明显矛盾，或把不同次运行的父子输出拼在一起时，应指出。地址显示格式（有无 0x）、换行与截图形状的细微差异属于合理差异，不判为不合格。
