    # 分页与 TLB 观察作业，需要 3 张终端截图，启用视觉审核。
    template_metrics:
      enabled: true
      report_file: Lab6.md
      characters: ['#', '-', '*', '`', '|', '>']
      max_file_bytes: 200000
    vision_files:
      - imgs/lab6_split.png
      - imgs/lab6_pagemap.png
      - imgs/lab6_tlb.png
    review_points:
      - 审核范围：本作业审核 3.1—3.4 的必做填写区、运行前预测、三个观察中的解释题与「四、结果分析与机制验证」的五道问答，以及「六、截图与提交前检查」列出的 3 张截图。重复运行属于选做，不要求填写或增加截图；「故障排查」「自查表」属于辅助内容，填与不填都不影响判定。题目、说明、示例、表格和图片引用须完整保留，但模板数量检查通过只说明没有删减模板，不能代替对填写内容的审核。
      - 3.1 准备：应填写练习目录完整路径（pwd 输出，课程环境通常以 /home/用户名/os-labs/Lab6 结尾）、源码传送方式、gcc 版本第一行、三次编译各自的结束状态、三个可执行文件是否齐全及是否出现报错。scp、Remote-SSH 或其他核对无误的传送方式均可，不要求虚拟机中另行克隆仓库；echo $? 应紧跟对应编译命令，不能用 ls 的成功状态替代编译状态。如实记录报错并最终修正成功的可以接受。
      - 运行前预测：3.2 的两个问题、3.3 的两阶段 present、3.4 的两个问题都应填写预测与理由。预测可以与实际不符，不因预测错误扣分；应保留预测并在解释题中核对实测差异，不要求预测与结果完全一致。全部留空时按不完整提醒，不能仅因预测恰好正确就认定是事后倒填。
      - 3.2 地址拆分：页大小与指针宽度按本人输出；4 KiB 页的偏移位数是 12。表中 48 位是本课模型假设，模型 VPN 位数为 48 减本人偏移位数，不能根据 maps 地址打印长度推断硬件支持位数。三个对象应填写地址、VPN、偏移与区间，核对 VPN = 地址整除页大小、偏移 = 地址对页大小取余，偏移范围为 0 至本人页大小减 1。全局变量应落在可执行文件的可写数据映射，不能把 [heap] 当作本例全局变量所在区域；malloc 对象通常在 [heap]，其他分配器下也可能落在匿名映射，按本人地址与区间核对；栈变量通常在 [stack]。rw-p 表示可读、可写、不可执行、私有映射，区间起点不要求等于变量所在页的首地址。
      - 3.3 页表状态：本例只申请尚未访问的匿名页时通常 present 为 0，写入后通常为 1，栈变量通常为 1；第一步条目不必全部为零，其他状态位可能已设置。若实测不同，应有原始输出并说明已核对执行顺序，不强迫学生改成样例。PFN 可见时核对 物理地址 = PFN × 本人页大小 + 偏移；present 为 1 但 PFN 为 0 时可能因权限受限而隐藏，不能据此认定页不在内存，也不要求计算物理地址。具有 CAP_SYS_ADMIN 等相应权限通常才能看到 PFN，容器中的 root 或 sudo 仍可能受限。已保留 sudo 命令与真实提示并说明限制的可以接受，不强制要求读取非零 PFN；pagemap 不可读时，应记录错误及尚未完成的目标，请教师核对环境，不因权限限制自动判整份报告不合格，也不把读取失败判为成功。
      - 3.3 解释题：应说明本例首次写入通过轻微缺页完成物理页分配、清零、建立可写映射与指令重试，且本次匿名页首次写入不需要从磁盘读取页内容；公式用本人页大小。去掉 sudo 的运行结果按实测填写，解释 PFN 限制用于减少物理地址布局泄露；不要求两次运行地址相同，不能把两次 PFN 与地址拼起来计算。pagemap 是内核导出格式，不是原始硬件 PTE。
      - 3.4 耗时与缺页：表一两次访问次数、耗时和新增轻微缺页及表二五档都应填写，访问次数按完整轮次取整，倍数允许因输出舍入而有小幅差异。工作集 KiB = 页数 × 本人页大小 ÷ 1024，相对64页 = 本档耗时 ÷ 64页档耗时，基准不是各档的最小值。ru_minflt 是轻微缺页统计，不统计 TLB 未命中，也不包含重大缺页。新增轻微缺页通常很少或为 0，非零时如实记录并讨论可能干扰即可，不强制要求为零，不要求证明唯一原因，也不能直接把该数值当作 TLB 未命中次数。选做重复运行时表格与截图应采用同一次完整运行，不逐行拼接。
      - 3.4 趋势与结论：允许没有明显拐点、耗时不单调或倍数小于样例，只需与本人数据相符。若有明显上升，核对该档页数乘本人页大小得到的工作集，不能直接把它当作硬件 TLB 容量或覆盖范围。耗时同时受数据 cache、TLB、页表缓存、循环、调度、透明大页和虚拟机等影响，不能把差异全部归因于 TLB。1536 项乘 4 KiB 为 6 MiB，假设同样项数用于 2 MiB 页则为 3 GiB，真实可用项数可能随页大小变化；无拐点时允许说明无法比较，不要求接近 6 MiB。页变大减少页数与表项需求、增大假定项数下的覆盖范围，但增加潜在内部碎片；至少给出两项机器差异或干扰因素。
      - 四、结果分析与机制验证：五题都应作答。第 1 题应说明映射、状态与权限需要存储空间，32 位一级页表示例为 4 MiB；valid 与 present 是教学抽象，不要求 x86 硬件各有一个同名独立位。第 2 题应在一级页表、忽略 cache、页驻留且权限允许的模型下答命中 1 次、未命中 2 次，实际多级页表和 cache 会改变内存条访问次数。第 3 题应把 present 对应到页的驻留状态，把耗时变化解释为 TLB 与 cache 等因素共同影响，不能只归因于 TLB。第 4 题应说明分页使虚拟连续的页可放在分散物理页框中，避免按基本页框分配时的外部碎片，代价是内部碎片、页表空间与地址转换开销。第 5 题写一项真实排错或主动核对记录即可。只写术语、答非所问或明显与实验结论矛盾的，按未完成处理。
      - 提交物边界：本作业只要求提交 Lab6.md 与 3 张截图，不要求提交 .c 源文件、可执行文件、编译输出、运行日志或任何 /proc 内容，练习用的文件留在虚拟机的 ~/os-labs/Lab6 中。报告中提到这些文件不得要求学生补交；提交目录里出现清单以外的文件按多余文件处理，并在反馈中指出应删除的文件名。
      - 合理差异与结论边界：地址、PFN、页大小、耗时、倍数按本人环境与运行结果填写，与示例不同不扣分。报告不得编造未观察到的输出，不能把权限限制或失败描述为验证成功；真实完成并能自证的部分按实测判断，明确说明的环境限制不得自动使整份报告不合格。不因个别措辞不精确或输出夹带无关行而降级。
    vision_review_points:
      - 截图总要求：必须是学生本人环境的电脑截图，终端截图需同时显示命令和对应输出，文字清晰可读；一张截图可以包含同一任务下的多条命令及其输出，但每条命令与其输出必须能对应上。出现手机拍摄屏幕的反光、摩尔纹或明显倾斜时判为不合格；截图中不得出现密码、私钥或访问令牌。允许裁剪无关区域，但不能裁掉命令或关键结果；本作业不要求截图出现身份标记，是否能看到用户名、主机名不作判分依据。
      - lab6_split.png：应能看到 ./addr_split 的运行命令，以及【全局变量】【堆上的对象】【栈上的变量】三段输出，每段含地址、页号 VPN、页内偏移与所在区间。缺少任意一段，或三段都没有「所在区间」行时判为不合格；仅缺其中一段的区间行时按不完整提醒。
      - lab6_pagemap.png：应能看到 sudo ./pte_dump 的命令及三阶段输出，通常第一步 present 为 0、第二步为 1、第三步是栈变量。PFN 可见时应有物理地址；PFN 为 0 且显示权限提示时，结合报告说明接受，不要求出现非零 PFN 或物理地址。pagemap 读取失败时，应保留原始错误与执行阶段，结合文本说明交由教师核对环境，不因限制自动判整份报告不合格。既无实验输出也无真实错误证据时判为不合格；正常可读时缺第一步或第二步判为不合格，缺第三步按不完整提醒。
      - lab6_tlb.png：应能看到 ./tlb_probe 的命令与两组输出，实验一两行与倍数、实验二五档工作集表格，包含每次耗时、相对64页与新增轻微缺页。允许无明显拐点、曲线不单调与非零轻微缺页，不因数值未达到样例而判错。缺实验二或倍数判为不合格；表格被截断但仍能看出五档与对应耗时的，按不完整提醒；不要求重复运行截图。
      - 报告与截图的一致性：报告填写的页大小、指针宽度、地址、PFN、耗时与倍数应与对应截图一致，48 位虚拟地址与模型 VPN 位数是课堂假设，不要求截图证明硬件地址宽度。各次 pte_dump 运行单独核对，不要求普通用户版与 sudo 版地址相同；不得拼接不同运行的地址与 PFN。选做重复 tlb_probe 时采用一组完整运行，不能逐行拼接。地址前缀、前导零及显示舍入属于合理差异，不判为不合格。
